      options: ["為了配合新幹線超高車速，特製的防震冰淇淋","乳脂肪含量極高且空氣極少，再加上用乾冰嚴格低溫控溫","故意凍硬讓遊客吃慢一點，打發搭車時間"],

      options: ["京都水質與氣候影響招牌油漆退色","京都嚴格實施《景觀條例》，禁止鮮豔顏色破壞古都風貌","為了節省霓虹燈招牌的電費"],

      correct: 1,
      explain: "創辦人江崎利一當初推出糖果時主打「營養補充」，經計算發現一顆糖的熱量（15.4 Kcal）剛好能讓一個成年人跑 300 公尺，這個標誌性的「300m 衝刺終點姿勢」就這樣沿用了上百年！"

      correct: 0,
      explain: "1606 年德川家康將富士山 8 合目以上的土地贈與給「淺間大社」。經過長期訴訟與協商，日本政府在 2004 年正式將山頂土地所有權歸還給神社，因此富士山頂其實是神社的私有地，國家每年還要付租金給神社！"

  var TAGS = ["A","B","C"];
  var state = { idx:0, score:0, log:[], locked:false };

  var $stamps = document.getElementById('stamps');
  var $viewIntro = document.getElementById('view-intro');
  var $viewQ = document.getElementById('view-question');
  var $viewResult = document.getElementById('view-result');

  function renderStamps(){
    $stamps.innerHTML = '';
    for (var i=0;i<QUESTIONS.length;i++){
      var el = document.createElement('div');
      el.className = 'stamp';
      if (state.log[i] === true) el.className += ' correct';
      else if (state.log[i] === false) el.className += ' wrong';
      else if (i === state.idx && $viewQ.classList.contains('is-active')) el.className += ' current';
      el.textContent = i + 1;
      $stamps.appendChild(el);
    }
  }

  function showView(id){
    [$viewIntro,$viewQ,$viewResult].forEach(function(v){ v.classList.remove('is-active'); });
    document.getElementById(id).classList.add('is-active');
    $stamps.style.display = (id === 'view-question') ? 'flex' : 'none';
    renderStamps();
  }

  function renderQuestion(){
    state.locked = false;
    var q = QUESTIONS[state.idx];
    document.getElementById('q-index').textContent = 'Q' + (state.idx+1) + ' / ' + QUESTIONS.length;
    document.getElementById('q-score').textContent = '答對 ' + state.score + ' 題';
    document.getElementById('q-text').textContent = q.text;

    var $opts = document.getElementById('q-options');
    $opts.innerHTML = '';
    q.options.forEach(function(optText, i){
      var btn = document.createElement('button');
      btn.className = 'option';
      btn.innerHTML = '<span class="tag">' + TAGS[i] + '</span><span class="opt-text">' + optText + '</span><span class="badge"></span>';
      btn.addEventListener('click', function(){ selectOption(i); });
      $opts.appendChild(btn);
    });

    document.getElementById('q-reveal').classList.remove('is-open');
    document.getElementById('q-explain').textContent = q.explain;
    document.getElementById('btn-next').style.display = 'none';
    document.getElementById('btn-next').textContent = (state.idx === QUESTIONS.length - 1) ? '查看結果 →' : '下一題 →';

    showView('view-question');
  }

  function selectOption(i){
    if (state.locked) return;
    state.locked = true;
    var q = QUESTIONS[state.idx];
    var isCorrect = (i === q.correct);
    state.log[state.idx] = isCorrect;
    if (isCorrect) state.score++;

    var opts = document.querySelectorAll('#q-options .option');
    opts.forEach(function(el, idx){
      el.classList.add('locked');
      var badge = el.querySelector('.badge');
      if (idx === q.correct){
        el.classList.add('is-correct');
        badge.textContent = '厲害';
      } else if (idx === i){
        el.classList.add('is-wrong');
        badge.textContent = '可惜';
      } else {
        el.classList.add('dim');
      }
    });

    document.getElementById('q-score').textContent = '答對 ' + state.score + ' 題';
    document.getElementById('q-reveal').classList.add('is-open');
    document.getElementById('btn-next').style.display = 'inline-flex';
    renderStamps();

    setTimeout(function(){
      var target = document.querySelector('.q-foot');
      var before = window.scrollY;
      try { target.scrollIntoView({ behavior:'smooth', block:'end', inline:'nearest' }); } catch(e){}
      setTimeout(function(){
        if (window.scrollY === before){
          target.scrollIntoView({ behavior:'instant', block:'end', inline:'nearest' });
        }
      }, 400);
    }, 360);
  }

  function nextQuestion(){
    state.idx++;
    if (state.idx >= QUESTIONS.length) renderResult();
    else renderQuestion();
  }

  function tierFor(score){
    if (score <= 3) return {
      title:'隨性旅遊派',
      msg:'想不到被奈良鹿撞、被迪士尼騙的背後都有這些秘密吧！'
    };
    if (score <= 7) return {
      title:'老司機認證派',
      msg:'觀察力不錯喔！連跑跑人起源都知道，離在地人只差一點了！'
    };
    return {
      title:'日本通認證派',
      msg:'分數高到可以去當導遊了，炸雞妖精、富士山地主都難不倒你！'
    };
  }

  function renderResult(){
    track('quiz-complete');
    var tier = tierFor(state.score);
    var pct = Math.round((state.score / QUESTIONS.length) * 100);
    document.getElementById('tier-title').textContent = tier.title;
    document.getElementById('tier-msg').textContent = tier.msg;

    var ring = document.getElementById('score-ring');
    ring.style.setProperty('--pct', 0);
    var numEl = document.getElementById('score-num');

    var shareText = '我在《日本旅遊冷知識檢定賽》答對 ' + state.score + '/10 題，被歸類為「' + tier.title + '」！你也來試試看，能撐過幾題？';
    document.getElementById('share-line').textContent = '考完了嗎？換你的朋友上場！';
    document.getElementById('copied-note').textContent = '';
    document.getElementById('share-fallback').classList.remove('show');

    var fullShareText = shareText + ' ' + location.href;

    function showManualCopy(msg){
      var note = document.getElementById('copied-note');
      var box = document.getElementById('share-fallback');
      note.textContent = msg;
      box.value = fullShareText;
      box.classList.add('show');
      box.focus();
      box.select();
    }

    document.getElementById('btn-share').onclick = function(){
      var note = document.getElementById('copied-note');
      function doneCopy(){
        note.textContent = '已複製分享文字 ✓';
        document.getElementById('share-fallback').classList.remove('show');
        setTimeout(function(){ note.textContent=''; }, 2400);
      }
      if (navigator.share){
        navigator.share({ text: shareText, url: location.href }).catch(function(err){
          if (err && err.name === 'AbortError') return; // user closed the share sheet, not an error
          if (navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(fullShareText).then(doneCopy, function(){ showManualCopy('無法自動分享，文字已選取，請按 Ctrl/Cmd+C 複製'); });
          } else {
            showManualCopy('無法自動分享，文字已選取，請按 Ctrl/Cmd+C 複製');
          }
        });
      } else if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(fullShareText).then(doneCopy, function(){ showManualCopy('無法自動複製，文字已選取，請按 Ctrl/Cmd+C 複製'); });
      } else {
        showManualCopy('此瀏覽器不支援自動複製，文字已選取，請按 Ctrl/Cmd+C 複製');
      }
    };

    showView('view-result');

    var start = null, duration = 700;
    function step(ts){
      if (!start) start = ts;
      var progress = Math.min((ts - start) / duration, 1);
      var current = Math.round(progress * state.score);
      numEl.innerHTML = current + '<span>/10</span>';
      ring.style.setProperty('--pct', Math.round(progress * pct));
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function restart(){
    state = { idx:0, score:0, log:[], locked:false };
    showView('view-intro');
  }

  document.getElementById('btn-start').addEventListener('click', function(){ track('quiz-start'); renderQuestion(); });
  document.getElementById('inline-banner-link').addEventListener('click', function(){ track('banner-inline-click'); });
  document.getElementById('cta-apply').addEventListener('click', function(){ track('banner-result-click'); });
  document.getElementById('btn-next').addEventListener('click', nextQuestion);
  document.getElementById('btn-restart').addEventListener('click', restart);

  $stamps.style.display = 'none';
  renderStamps();

  // dev shortcut: open with #result or #result=N to preview the result screen directly
  var resultPreview = location.hash.match(/^#result(?:=(\d+))?$/);
  if (resultPreview){
    var n = resultPreview[1] !== undefined ? Math.max(0, Math.min(10, parseInt(resultPreview[1], 10))) : 7;
    state.score = n;
    for (var i = 0; i < QUESTIONS.length; i++) state.log[i] = i < n;
    renderResult();
  }
})();
</script>
